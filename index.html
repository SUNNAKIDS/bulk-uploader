<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SunnaKids — Web Bulk Downloader & Uploader</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #00adef;
      --primary-hover: #0096ce;
      --accent-green: #16a34a;
      --accent-amber: #d97706;
      --accent-rose: #e11d48;
      --console-bg: #090d16;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      --mono-font: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      background-image: url('bg-pattern.svg');
      background-repeat: no-repeat;
      background-position: top left;
      background-size: min(650px, 80vw) auto;
      background-attachment: fixed;
      color: var(--text-main);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.5rem;
    }

    .header-logo {
      height: 70px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.06));
    }

    header h1 {
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #0f172a;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.75rem;
      box-shadow: 0 10px 25px -5px rgba(0, 173, 239, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    label {
      font-size: 0.825rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .input-row {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    input[type="text"] {
      flex: 1;
      min-width: 200px;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #0f172a;
      font-family: var(--mono-font);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 173, 239, 0.18);
      background: #ffffff;
    }

    .btn {
      padding: 0.75rem 1.4rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background 0.2s, transform 0.1s, opacity 0.2s, border-color 0.2s;
      user-select: none;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(0, 173, 239, 0.25);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
      box-shadow: 0 4px 14px rgba(0, 173, 239, 0.35);
    }

    .btn-outline {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: #334155;
    }

    .btn-outline:hover:not(:disabled) {
      background: #f1f5f9;
      border-color: #94a3b8;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .progress-section {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-top: 1.25rem;
    }

    .progress-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .progress-bar-bg {
      width: 100%;
      height: 12px;
      background: #e2e8f0;
      border-radius: 9999px;
      overflow: hidden;
      border: 1px solid #cbd5e1;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00adef, #22c55e);
      border-radius: 9999px;
      transition: width 0.25s ease-out;
    }

    .log-container {
      background: var(--console-bg);
      border: 1px solid #1e293b;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 340px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
    }

    .log-header {
      background: #111827;
      padding: 0.6rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e293b;
      font-size: 0.8rem;
      color: #94a3b8;
    }

    .log-body {
      flex: 1;
      padding: 0.75rem 1rem;
      overflow-y: auto;
      font-family: var(--mono-font);
      font-size: 0.85rem;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .log-entry {
      word-break: break-all;
    }

    .log-entry.info { color: #94a3b8; }
    .log-entry.step { color: #38bdf8; font-weight: 600; }
    .log-entry.ok { color: #22c55e; }
    .log-entry.warn { color: #f59e0b; }
    .log-entry.err { color: #f43f5e; font-weight: 600; }

    .tag {
      display: inline-block;
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      font-size: 0.75rem;
      margin-right: 0.4rem;
      font-weight: 600;
    }
    .tag-ok { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
    .tag-err { background: rgba(244, 63, 94, 0.2); color: #fb7185; }
    .tag-step { background: rgba(56, 189, 248, 0.2); color: #38bdf8; }

    footer {
      text-align: center;
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <img src="logo.png" alt="SunnaKids" class="header-logo" />
      <h1>Bulk Uploader</h1>
    </header>

    <div class="card">
      <div class="form-group">
        <label for="deviceIp">Device IP Address</label>
        <div class="input-row">
          <input type="text" id="deviceIp" placeholder="192.168.1.21" value="192.168.1.21" />
          <button id="pingBtn" class="btn btn-outline" onclick="testPing()">Test Ping</button>
          <button id="formatBtn" class="btn btn-outline" onclick="formatDevice()">Format NAND</button>
          <button id="demoBtn" class="btn btn-primary" onclick="startDemoUpload()">Demo Upload</button>
          <!-- Production Upload hidden until catalog data is ready -->
          <button id="actualBtn" class="btn btn-primary" onclick="startActualUpload()" style="display: none;">Production Upload</button>
        </div>
      </div>

      <div class="progress-section">
        <div class="progress-labels">
          <span id="progressText">Ready to start</span>
          <span id="progressPercent">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div id="progressBar" class="progress-bar-fill"></div>
        </div>
      </div>
    </div>

    <div class="card" style="padding: 0;">
      <div class="log-container">
        <div class="log-header">
          <span>Activity Log</span>
          <div style="display:flex; gap: 0.5rem;">
            <button class="btn btn-outline" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;" onclick="clearLogs()">Clear</button>
            <button class="btn btn-outline" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;" onclick="copyLogs()">Copy</button>
          </div>
        </div>
        <div id="logBody" class="log-body">
          <div class="log-entry info">Ready. Enter device IP and click "Demo Upload".</div>
        </div>
      </div>
    </div>

    <footer>
      SunnaKids Tooling &bull; Client-Side Browser Uploader
    </footer>
  </div>

  <script>
    // Configuration & Data
    const SOURCE_URL_FMT = "https://server8.mp3quran.net/afs/{num}.mp3";
    const SOURCE_NUMS = [105, 106, 107, 108, 109, 110, 111, 112, 113, 114];
    
    const SURAH_NAMES = {
      105: "Al-Fil", 106: "Quraysh", 107: "Al-Ma'un", 108: "Al-Kawthar",
      109: "Al-Kafirun", 110: "An-Nasr", 111: "Al-Masad", 112: "Al-Ikhlas",
      113: "Al-Falaq", 114: "An-Nas"
    };

    const EXTRA_CATEGORIES = {
      "prophets": [
        "Story of Prophet Ibrahim", "Story of Prophet Musa", 
        "Story of Prophet Yusuf", "Story of Prophet Yunus", "Story of Prophet Isa"
      ],
      "original_stories": [
        "The People of the Cave", "The People of the Elephant", 
        "The Story of Luqman", "The Story of Qarun", "The Story of Dhul-Qarnayn"
      ],
      "companions": [
        "Life of Abu Bakr", "Life of Umar", 
        "Life of Uthman", "Life of Ali", "Life of Khalid ibn Al-Walid"
      ]
    };

    const THUMB_COLORS = [
      { bg: "#ffffff", fg: "#000000" },
      { bg: "#000000", fg: "#ffffff" },
      { bg: "#555555", fg: "#ffffff" },
      { bg: "#006400", fg: "#ffffff" },
      { bg: "#000080", fg: "#ffffff" },
      { bg: "#8b0000", fg: "#ffffff" },
      { bg: "#6b21a8", fg: "#ffffff" },
      { bg: "#ea580c", fg: "#000000" },
      { bg: "#eab308", fg: "#000000" },
      { bg: "#06b6d4", fg: "#000000" },
      { bg: "#c026d3", fg: "#ffffff" }
    ];

    let isRunning = false;

    // Load saved IP
    window.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('sunnakids_ip');
      if (saved) document.getElementById('deviceIp').value = saved;
    });

    function getBaseUrl() {
      let ip = document.getElementById('deviceIp').value.trim();
      if (!ip) throw new Error("Please enter a device IP address");
      localStorage.setItem('sunnakids_ip', ip);
      ip = ip.replace(/^https?:\/\//i, '').replace(/\/+$/, '');
      return `http://${ip}`;
    }

    function log(msg, type = "info") {
      const body = document.getElementById('logBody');
      const div = document.createElement('div');
      div.className = `log-entry ${type}`;
      div.innerHTML = msg;
      body.appendChild(div);
      body.scrollTop = body.scrollHeight;
    }

    function clearLogs() {
      document.getElementById('logBody').innerHTML = '';
    }

    function copyLogs() {
      const text = document.getElementById('logBody').innerText;
      navigator.clipboard.writeText(text).then(() => {
        alert("Logs copied to clipboard!");
      });
    }

    function setProgress(current, total, label = "") {
      const pct = Math.min(100, Math.round((current / total) * 100));
      document.getElementById('progressBar').style.width = `${pct}%`;
      document.getElementById('progressPercent').innerText = `${pct}%`;
      if (label) document.getElementById('progressText').innerText = label;
    }

    function setStatus(text, color = "var(--text-muted)") {
      const badge = document.getElementById('statusBadge');
      if (badge) {
        badge.innerText = text;
        badge.style.color = color;
      }
    }

    function sanitizeFilename(name) {
      return name.replace(/[^a-zA-Z0-9._-]/g, '_');
    }

    // HTML5 Canvas Thumbnail Generator (149x199 PNG)
    function generateThumbBlob(title) {
      return new Promise((resolve) => {
        const canvas = document.createElement('canvas');
        canvas.width = 149;
        canvas.height = 199;
        const ctx = canvas.getContext('2d');

        const pair = THUMB_COLORS[Math.floor(Math.random() * THUMB_COLORS.length)];

        // Background
        ctx.fillStyle = pair.bg;
        ctx.fillRect(0, 0, 149, 199);

        // Text styling & wrap
        ctx.fillStyle = pair.fg;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = 'bold 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';

        const words = title.split(' ');
        const lines = [];
        let currentLine = words[0];
        const maxWidth = 135;

        for (let i = 1; i < words.length; i++) {
          const test = currentLine + ' ' + words[i];
          if (ctx.measureText(test).width > maxWidth) {
            lines.push(currentLine);
            currentLine = words[i];
          } else {
            currentLine = test;
          }
        }
        lines.push(currentLine);

        const lineHeight = 20;
        const startY = (199 - (lines.length - 1) * lineHeight) / 2;
        lines.forEach((line, i) => {
          ctx.fillText(line, 149 / 2, startY + (i * lineHeight));
        });

        canvas.toBlob((blob) => resolve(blob), 'image/png');
      });
    }

    // Ping check helper with timeout
    async function checkPing(baseUrl, timeoutMs = 4000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const res = await fetch(`${baseUrl}/ping`, {
          method: "GET",
          cache: "no-store",
          signal: controller.signal
        });
        clearTimeout(timer);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();
        return { ok: true, text };
      } catch (err) {
        clearTimeout(timer);
        return { ok: false, error: err.name === 'AbortError' ? 'Connection timed out' : err.message };
      }
    }

    // Test ping helper
    async function testPing() {
      let baseUrl;
      try {
        baseUrl = getBaseUrl();
      } catch (err) {
        log(`<span class="tag tag-err">ERR</span> ${err.message}`, "err");
        alert(err.message);
        return;
      }

      log(`Pinging ${baseUrl}/ping ...`, "info");
      const res = await checkPing(baseUrl, 4000);
      if (res.ok) {
        log(`<span class="tag tag-ok">PING OK</span> Response: ${res.text}`, "ok");
      } else {
        log(`<span class="tag tag-err">PING FAIL</span> ${res.error} (Device not found)`, "err");
        alert(`Device not found at IP: ${baseUrl.replace(/^http:\/\//, '')}`);
      }
    }

    // Binary upload helper
    async function postBinary(url, params, blob) {
      const q = new URLSearchParams(params).toString();
      const fullUrl = `${url}?${q}`;
      try {
        const res = await fetch(fullUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/octet-stream' },
          body: blob
        });
        const json = await res.json();
        if (res.ok && json.status === "success") {
          return { ok: true, path: json.path || "" };
        }
        return { ok: false, msg: json.message || `HTTP ${res.status}` };
      } catch (err) {
        return { ok: false, msg: err.message };
      }
    }

    function setButtonsDisabled(disabled) {
      ['pingBtn', 'formatBtn', 'demoBtn', 'actualBtn'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.disabled = disabled;
      });
    }

    // Format NAND helper with ping check
    async function formatDevice() {
      if (isRunning) return;

      let baseUrl;
      try {
        baseUrl = getBaseUrl();
      } catch (err) {
        log(`<span class="tag tag-err">ERR</span> ${err.message}`, "err");
        alert(err.message);
        return;
      }

      const targetIp = baseUrl.replace(/^http:\/\//, '');

      // Ping check before formatting
      log(`Checking device availability at ${baseUrl}/ping ...`, "info");
      const pingRes = await checkPing(baseUrl, 4000);
      if (!pingRes.ok) {
        log(`<span class="tag tag-err">DEVICE NOT FOUND</span> Could not reach device at ${targetIp} (${pingRes.error})`, "err");
        alert(`Device not found at IP: ${targetIp}`);
        return;
      }

      log(`<span class="tag tag-ok">DEVICE CONNECTED</span> Ping response: ${pingRes.text}`, "ok");

      if (!confirm(`Are you sure you want to format NAND flash on ${targetIp}? This will erase all content on the device.`)) {
        return;
      }

      isRunning = true;
      setButtonsDisabled(true);
      setProgress(0, 100, "Formatting NAND flash...");
      log(`Formatting device NAND flash at ${baseUrl}/api/format ...`, "info");

      try {
        const res = await fetch(`${baseUrl}/api/format`, { method: "POST" });
        if (!res.ok) throw new Error(`Format returned HTTP ${res.status}`);
        log(`<span class="tag tag-ok">OK</span> NAND Formatted successfully.`, "ok");
        setProgress(100, 100, "NAND Formatted successfully");
        alert("NAND flash formatted successfully!");
      } catch (err) {
        log(`<span class="tag tag-err">FAIL</span> Format failed: ${err.message}`, "err");
        alert(`Format failed: ${err.message}`);
        setProgress(0, 100, "Format failed");
      } finally {
        isRunning = false;
        setButtonsDisabled(false);
      }
    }

    // Finalize device helper (refresh + health checks)
    async function finalizeDevice(baseUrl) {
      log(`<br><span class="tag tag-step">STEP: FINALIZE</span> Refreshing device...`, "step");
      try {
        await fetch(`${baseUrl}/api/refresh`, { method: 'POST' });
        log(`  <span class="tag tag-ok">OK</span> Refresh complete.`, "ok");
      } catch (e) {
        log(`  <span class="tag tag-warn">WARN</span> Refresh error: ${e.message}`, "warn");
      }

      log(`<br><b>--- System Health ---</b>`, "info");
      try {
        const pingRes = await fetch(`${baseUrl}/ping`).then(r => r.text());
        log(`  Ping: ${pingRes}`, "info");
      } catch (e) { log(`  Ping failed: ${e.message}`, "warn"); }

      try {
        const healthRes = await fetch(`${baseUrl}/api/health`).then(r => r.text());
        log(`  Health: ${healthRes}`, "info");
      } catch (e) { log(`  Health failed: ${e.message}`, "warn"); }
    }

    // Download single Surah with retry
    async function downloadSurah(num) {
      const padNum = String(num).padStart(3, '0');
      const url = SOURCE_URL_FMT.replace('{num}', padNum);
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status} from mp3quran.net`);
      const blob = await res.blob();
      if (blob.size < 1024) throw new Error(`File too small (${blob.size} bytes)`);
      return blob;
    }

    // 1. DEMO UPLOAD (One-by-one stream of 10 Surahs + re-used categories)
    async function startDemoUpload() {
      if (isRunning) return;

      let baseUrl;
      try {
        baseUrl = getBaseUrl();
      } catch (err) {
        log(`<span class="tag tag-err">ERR</span> ${err.message}`, "err");
        alert(err.message);
        return;
      }

      // Pre-check ping
      log(`Checking device availability at ${baseUrl}/ping ...`, "info");
      const pingResult = await checkPing(baseUrl, 4000);
      if (!pingResult.ok) {
        const targetIp = baseUrl.replace(/^http:\/\//, '');
        log(`<span class="tag tag-err">DEVICE NOT FOUND</span> Could not reach device at ${targetIp} (${pingResult.error})`, "err");
        alert(`Device not found at IP: ${targetIp}`);
        return;
      }

      log(`<span class="tag tag-ok">DEVICE CONNECTED</span> Ping response: ${pingResult.text}`, "ok");

      isRunning = true;
      setButtonsDisabled(true);
      setProgress(0, 100, "Starting Demo Upload...");
      setStatus("Running...", "var(--primary)");

      try {
        // Step 1: Format Device
        log(`<br><span class="tag tag-step">STEP 1</span> Formatting device NAND flash...`, "step");
        setProgress(2, 27, "Formatting device...");
        const formatRes = await fetch(`${baseUrl}/api/format`, { method: 'POST' });
        if (!formatRes.ok) throw new Error(`Format returned HTTP ${formatRes.status}`);
        log(`  <span class="tag tag-ok">OK</span> NAND Formatted successfully.`, "ok");

        // Step 2: One-by-one download & upload for Quran (Surahs 105-114)
        log(`<br><span class="tag tag-step">STEP 2</span> Streaming Quran tracks one-by-one...`, "step");
        const uploadUrl = `${baseUrl}/api/upload`;
        const cachedSurahs = {}; // Cache 105-109 for reuse
        let stepCount = 2;

        for (const num of SOURCE_NUMS) {
          const title = SURAH_NAMES[num];
          const stem = sanitizeFilename(title);
          setProgress(++stepCount, 27, `[quran] ${title}...`);
          log(`  Downloading Surah ${num} (${title})...`, "info");

          const audioBlob = await downloadSurah(num);
          if (num <= 109) cachedSurahs[num] = audioBlob;

          const thumbBlob = await generateThumbBlob(title);
          await postBinary(uploadUrl, { name: `${stem}.png`, category: 'quran' }, thumbBlob);

          const res = await postBinary(uploadUrl, { name: `${stem}.mp3`, category: 'quran', title: title }, audioBlob);
          if (res.ok) {
            log(`  <span class="tag tag-ok">OK</span> [quran] ${title}`, "ok");
          } else {
            log(`  <span class="tag tag-err">FAIL</span> [quran] ${title}: ${res.msg}`, "err");
          }
        }

        // Step 3: Re-use cached audio for extra categories
        log(`<br><span class="tag tag-step">STEP 3</span> Uploading extra categories...`, "step");
        const reUseIds = [105, 106, 107, 108, 109];
        for (const [cat, titles] of Object.entries(EXTRA_CATEGORIES)) {
          log(`<b>-- Category: ${cat} --</b>`, "info");
          for (let i = 0; i < titles.length; i++) {
            const title = titles[i];
            const stem = sanitizeFilename(title);
            const audioBlob = cachedSurahs[reUseIds[i]];
            setProgress(++stepCount, 27, `[${cat}] ${title}...`);

            const thumbBlob = await generateThumbBlob(title);
            await postBinary(uploadUrl, { name: `${stem}.png`, category: cat }, thumbBlob);

            const res = await postBinary(uploadUrl, { name: `${stem}.mp3`, category: cat, title: title }, audioBlob);
            if (res.ok) {
              log(`  <span class="tag tag-ok">OK</span> [${cat}] ${title}`, "ok");
            } else {
              log(`  <span class="tag tag-err">FAIL</span> [${cat}] ${title}: ${res.msg}`, "err");
            }
          }
        }

        // Finalize
        await finalizeDevice(baseUrl);
        setStatus("Completed!", "var(--accent-green)");
        setProgress(100, 100, "Demo upload completed successfully!");
        log(`<br><span class="tag tag-ok">DONE</span> <b>Demo upload finished!</b>`, "ok");
        alert("Demo upload completed successfully!");

      } catch (err) {
        setStatus("Failed", "var(--accent-rose)");
        log(`<br><span class="tag tag-err">ERROR</span> ${err.message}`, "err");
        alert(`Upload error: ${err.message}`);
      } finally {
        isRunning = false;
        setButtonsDisabled(false);
      }
    }

    // 2. ACTUAL UPLOAD (Reads content.json and streams one-by-one)
    async function startActualUpload() {
      if (isRunning) return;

      let baseUrl;
      try {
        baseUrl = getBaseUrl();
      } catch (err) {
        log(`<span class="tag tag-err">ERR</span> ${err.message}`, "err");
        alert(err.message);
        return;
      }

      // Pre-check ping
      log(`Checking device availability at ${baseUrl}/ping ...`, "info");
      const pingResult = await checkPing(baseUrl, 4000);
      if (!pingResult.ok) {
        const targetIp = baseUrl.replace(/^http:\/\//, '');
        log(`<span class="tag tag-err">DEVICE NOT FOUND</span> Could not reach device at ${targetIp} (${pingResult.error})`, "err");
        alert(`Device not found at IP: ${targetIp}`);
        return;
      }

      log(`<span class="tag tag-ok">DEVICE CONNECTED</span> Ping response: ${pingResult.text}`, "ok");

      // Load content.json
      log(`Loading content catalog from content.json ...`, "info");
      let catalog;
      try {
        const jsonRes = await fetch('./content.json', { cache: 'no-store' });
        if (!jsonRes.ok) throw new Error(`HTTP ${jsonRes.status}`);
        catalog = await jsonRes.json();
      } catch (e) {
        log(`<span class="tag tag-err">ERR</span> Failed to load content.json: ${e.message}`, "err");
        alert(`Failed to load content.json: ${e.message}`);
        return;
      }

      // Count total items
      let totalItems = 0;
      for (const cat in catalog.categories) {
        totalItems += catalog.categories[cat].length;
      }

      if (totalItems === 0) {
        alert("No items found in content.json!");
        return;
      }

      // Optional format prompt
      const targetIp = baseUrl.replace(/^http:\/\//, '');
      const shouldFormat = confirm(`Do you want to format NAND flash before uploading ${totalItems} tracks to ${targetIp}?\n\n• Click OK to ERASE device and upload fresh catalog.\n• Click Cancel to keep existing tracks and upload new files.`);

      isRunning = true;
      setButtonsDisabled(true);
      setStatus("Uploading Catalog...", "var(--primary)");

      try {
        if (shouldFormat) {
          log(`<br><span class="tag tag-step">FORMAT</span> Formatting device NAND flash...`, "step");
          setProgress(0, totalItems, "Formatting NAND flash...");
          const formatRes = await fetch(`${baseUrl}/api/format`, { method: 'POST' });
          if (!formatRes.ok) throw new Error(`Format returned HTTP ${formatRes.status}`);
          log(`  <span class="tag tag-ok">OK</span> NAND Formatted.`, "ok");
        }

        const uploadUrl = `${baseUrl}/api/upload`;
        let processedCount = 0;

        log(`<br><span class="tag tag-step">STREAMING</span> Uploading ${totalItems} tracks one-by-one...`, "step");

        for (const cat in catalog.categories) {
          const items = catalog.categories[cat];
          log(`<b>-- Category: ${cat} (${items.length} items) --</b>`, "info");

          for (const item of items) {
            processedCount++;
            const title = item.name;
            const stem = sanitizeFilename(title);
            setProgress(processedCount, totalItems, `[${cat}] (${processedCount}/${totalItems}) ${title}...`);
            log(`[${processedCount}/${totalItems}] Processing [${cat}] "${title}"...`, "info");

            // 1. Download or Generate Thumbnail
            let thumbBlob = null;
            if (item.thumbnail_path && !item.thumbnail_path.includes('example.com')) {
              try {
                const thumbRes = await fetch(item.thumbnail_path);
                if (thumbRes.ok) {
                  thumbBlob = await thumbRes.blob();
                }
              } catch (e) {
                log(`    <span class="tag tag-warn">WARN</span> Thumbnail download failed for ${title}, falling back to auto-cover.`, "warn");
              }
            }

            // Fallback to generated canvas thumbnail if no external thumbnail
            if (!thumbBlob || thumbBlob.size < 100) {
              thumbBlob = await generateThumbBlob(title);
            }

            // Upload Thumbnail
            await postBinary(uploadUrl, { name: `${stem}.png`, category: cat }, thumbBlob);
            thumbBlob = null; // Free memory immediately

            // 2. Download Audio
            let audioBlob = null;
            try {
              const audioRes = await fetch(item.audio_path);
              if (!audioRes.ok) throw new Error(`HTTP ${audioRes.status}`);
              audioBlob = await audioRes.blob();
            } catch (e) {
              log(`    <span class="tag tag-err">FAIL</span> Could not download audio for "${title}": ${e.message}`, "err");
              continue; // Skip upload for this track if download failed
            }

            // Upload Audio
            const upRes = await postBinary(uploadUrl, { name: `${stem}.mp3`, category: cat, title: title }, audioBlob);
            audioBlob = null; // Free memory immediately

            if (upRes.ok) {
              log(`    <span class="tag tag-ok">OK</span> Uploaded [${cat}] ${title}`, "ok");
            } else {
              log(`    <span class="tag tag-err">FAIL</span> Upload failed for [${cat}] ${title}: ${upRes.msg}`, "err");
            }
          }
        }

        // Finalize
        await finalizeDevice(baseUrl);
        setStatus("Completed!", "var(--accent-green)");
        setProgress(100, 100, "Production upload completed successfully!");
        log(`<br><span class="tag tag-ok">DONE</span> <b>Production bulk upload completed!</b>`, "ok");
        alert("Production upload completed successfully!");

      } catch (err) {
        setStatus("Failed", "var(--accent-rose)");
        log(`<br><span class="tag tag-err">ERROR</span> ${err.message}`, "err");
        alert(`Upload error: ${err.message}`);
      } finally {
        isRunning = false;
        setButtonsDisabled(false);
      }
    }
  </script>
</body>
</html>
